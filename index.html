<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Grünes Bremen – Lage &amp; Mitmachen</title>
  <meta name="description" content="Persönliche Lage zu Bremer Themen mit Relevanz für die Grünen – und Ideen zum Mitmachen.">
  <meta name="theme-color" content="#f6f4ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101110" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Grünes Bremen">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="kopf">
    <div class="kopf-innen">
      <a href="#/" class="marke" aria-label="Grünes Bremen – zur Lage">
        <img src="icons/icon.svg" alt="" width="26" height="26">
        <span>Grünes Bremen</span>
      </a>
      <div class="kopf-rechts">
        <span id="stand" class="stand" aria-live="polite"></span>
        <button id="neu-laden" class="icon-knopf" type="button" aria-label="Daten neu laden" title="Daten neu laden">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
        </button>
      </div>
    </div>
    <div id="offline" class="offline" hidden>Offline · zuletzt geladene Meldungen</div>
  </header>

  <main id="app" class="inhalt" tabindex="-1">
    <p class="laden">Lade Meldungen …</p>
  </main>

  <nav class="tabbar" aria-label="Hauptnavigation">
    <a href="#/" data-route="">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h13a3 3 0 0 1 3 3v11H7a3 3 0 0 1-3-3V5Zm4 4h8M8 13h8M8 17h5"/></svg>
      <span>Lage</span>
    </a>
    <a href="#/gemerkt" data-route="gemerkt">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4V4Z"/></svg>
      <span>Gemerkt</span>
    </a>
    <a href="#/themen" data-route="themen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
      <span>Themen</span>
    </a>
    <a href="#/engagement" data-route="engagement">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg>
      <span>Engagement</span>
    </a>
    <a href="#/einstellungen" data-route="einstellungen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      <span>Einstellungen</span>
    </a>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-hintergrund" data-act="sheet-zu"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Filter">
      <div class="sheet-griff" aria-hidden="true"></div>
      <div id="sheet-inhalt"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
